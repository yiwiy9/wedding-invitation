service: ${self:custom.appName}
frameworkVersion: '3'

useDotenv: true

plugins:
  - serverless-domain-manager
  - serverless-offline
  - serverless-plugin-typescript
  - serverless-s3-sync

custom:
  appName: wedding-invitation-app
  defaultStage: dev

  backendFQDN:
    dev: dev-api-wedding.${env:APP_DOMAIN_NAME}
    prod: api-wedding.${env:APP_DOMAIN_NAME}

  frontendFQDN:
    dev: dev-wedding.${env:APP_DOMAIN_NAME}
    prod: wedding.${env:APP_DOMAIN_NAME}

  googleSpreadsheetId:
    dev: ${env:DEV_GOOGLE_SPREADSHEET_ID}
    prod: ${env:PROD_GOOGLE_SPREADSHEET_ID}

  # serverless-domain-manager
  customDomain:
    domainName: ${self:custom.backendFQDN.${self:provider.stage}}
    stage: ${self:provider.stage}
    basePath: ''
    createRoute53Record: true
    createRoute53IPv6Record: true
    endpointType: REGIONAL
    securityPolicy: tls_1_2
    apiType: http
    autoDomain: true

  # serverless-s3-sync
  s3Sync:
    # `bucketName: !Ref S3Bucket`だと変数展開されず、上手くいかないのでスタックの出力を参照する
    - bucketNameKey: BucketNameOutputKey
      localDir: frontend/build

provider:
  name: aws
  runtime: nodejs16.x
  stage: ${opt:stage, self:custom.defaultStage}
  region: ap-northeast-1
  architecture: arm64
  memorySize: 128
  timeout: 6
  versionFunctions: false
  environment:
    NODE_OPTIONS: --enable-source-maps # ソースマップを有効にする
    GOOGLE_SPREADSHEET_ID: ${self:custom.googleSpreadsheetId.${self:provider.stage}}
    GOOGLE_SERVICE_ACCOUNT_EMAIL: ${env:GOOGLE_SERVICE_ACCOUNT_EMAIL}
    GOOGLE_PRIVATE_KEY: ${env:GOOGLE_PRIVATE_KEY}
  httpApi:
    disableDefaultEndpoint: true
    cors:
      allowedOrigins:
        - https://${self:custom.frontendFQDN.${self:provider.stage}}
      allowedHeaders:
        - Content-Type
        - X-Amz-Date
        - Authorization
        - X-Api-Key
        - X-Amz-Security-Token
        - X-Amz-User-Agent
        - X-Amzn-Trace-Id
      allowedMethods:
        - OPTIONS
        - GET
        - POST

package:
  patterns:
    - '!frontend/**' # フロントエンドのコードはLambda関数に含めない

functions:
  postUser:
    handler: backend/api/postUser.handler
    events:
      - httpApi:
          path: /users
          method: post
  getSamples:
    handler: backend/api/getSamples.handler
    events:
      - httpApi:
          path: /samples
          method: get
  postSample:
    handler: backend/api/postSample.handler
    events:
      - httpApi:
          path: /samples
          method: post

resources:
  - ${file(./resources/bucket.yml)}
  - ${file(./resources/oac.yml)}
  - ${file(./resources/distribution.yml)}
  - ${file(./resources/domain.yml)}
