openapi: 3.0.2
info:
  title: Wedding Invitation API
  version: 1.0.0
paths:
  /users:
    post:
      operationId: postUser
      summary: 新規ユーザーの作成
      tags:
        - User
      requestBody:
        $ref: '#/components/requestBodies/PostUser'
      responses:
        '201':
          $ref: '#/components/responses/Users'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UserValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /samples:
    get:
      operationId: getSamples
      summary: サンプル：メールの一覧を取得
      tags:
        - Sample
      responses:
        '200':
          $ref: '#/components/responses/Samples'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: postSample
      summary: サンプル：新規メールの作成
      tags:
        - Sample
      requestBody:
        $ref: '#/components/requestBodies/PostSample'
      responses:
        '201':
          $ref: '#/components/responses/Sample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/SampleValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  requestBodies:
    PostUser:
      description: 新規ユーザーの作成用リクエストボディ
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateUserInput'
    PostSample:
      description: サンプル：新規メールの作成用リクエストボディ
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateSampleInput'
  responses:
    Users:
      description: 複数ユーザーのレスポンスボディ
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/User'
    UserValidationError:
      description: ユーザーバリデーションエラーのレスポンスボディ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateUserValidationError'
    Sample:
      description: 単一サンプルのレスポンスボディ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Sample'
    Samples:
      description: 複数サンプルのレスポンスボディ
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Sample'
    SampleValidationError:
      description: サンプルバリデーションエラーのレスポンスボディ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateSampleValidationError'
    BadRequest:
      description: 共通の400エラーレスポンスボディ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequest'
    NotFound:
      description: 共通の404エラーレスポンスボディ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'
    InternalServerError:
      description: 共通の500エラーレスポンスボディ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
  schemas:
    UserBase:
      type: object
      properties:
        familyNameKanji:
          type: string
          maxLength: 150
          example: 山田
        givenNameKanji:
          type: string
          maxLength: 150
          example: 太郎
        familyNameKana:
          type: string
          maxLength: 150
          example: やまだ
        givenNameKana:
          type: string
          maxLength: 150
          example: たろう
        allergy:
          type: string
          maxLength: 150
          example: 卵
      required:
        - familyNameKanji
        - givenNameKanji
        - familyNameKana
        - givenNameKana
    UserWithoutIsAttend:
      allOf:
        - $ref: '#/components/schemas/UserBase'
        - type: object
          properties:
            zipCode:
              type: string
              pattern: ^\d{7}$
              example: '1234567'
            address1:
              type: string
              maxLength: 150
              example: 東京都ｘｘ区ｘｘｘ 1-1-1
            address2:
              type: string
              maxLength: 150
              example: ｘｘマンション 101号室
            email:
              type: string
              format: email
              example: yamada@example.com
            tel:
              type: string
              format: ^0\d{9,10}$
              example: '09012345678'
            message:
              type: string
              maxLength: 500
              example: おめでとう！
          required:
            - zipCode
            - address1
            - email
    User:
      allOf:
        - $ref: '#/components/schemas/UserWithoutIsAttend'
        - type: object
          properties:
            isAttend:
              type: boolean
              example: true
          required:
            - isAttend
    CreateUserInput:
      allOf:
        - $ref: '#/components/schemas/UserWithoutIsAttend'
        - type: object
          properties:
            isAttend:
              type: string
              enum:
                - 'true'
                - 'false'
              example: 'true'
            children:
              type: array
              minItems: 0
              maxItems: 10
              items:
                $ref: '#/components/schemas/UserBase'
          required:
            - isAttend
            - children
    CreateUserValidationError:
      type: array
      minItems: 1
      maxItems: 13
      items:
        type: object
        properties:
          name:
            type: string
            enum:
              - familyNameKanji
              - givenNameKanji
              - familyNameKana
              - givenNameKana
              - allergy
              - isAttend
              - zipCode
              - address1
              - address2
              - email
              - tel
              - message
              - children
            example: email
          reason:
            type: string
            example: email is invalid.
        required:
          - name
          - reason
    Sample:
      type: object
      properties:
        sampleEmail:
          type: string
          format: email
          example: yamada@example.com
      required:
        - sampleEmail
    CreateSampleInput:
      $ref: '#/components/schemas/Sample'
    CreateSampleValidationError:
      type: array
      minItems: 1
      maxItems: 1
      items:
        type: object
        properties:
          name:
            type: string
            enum:
              - sampleEmail
            example: sampleEmail
          reason:
            type: string
            example: sampleEmail is invalid.
        required:
          - name
          - reason
    Error:
      type: object
      properties:
        message:
          type: string
          example: Not found.
      required:
        - message
    BadRequest:
      $ref: '#/components/schemas/Error'
    NotFound:
      $ref: '#/components/schemas/Error'
    InternalServerError:
      $ref: '#/components/schemas/Error'
